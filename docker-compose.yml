services:

  db:
    image: postgres:17
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  adminer:
    image: adminer
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.rule=Host(`adminer.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.rule=Host(`adminer.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls.certresolver=le
      - traefik.http.services.${STACK_NAME?Variable not set}-adminer.loadbalancer.server.port=8080

  prestart:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    build:
      context: ./backend
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: ./backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-backend.loadbalancer.server.port=8000

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls.certresolver=le

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.middlewares=https-redirect

  # Model service. Internal only — no traefik labels, no public hostname.
  # Reached by the backend as http://labse:8000. Owns exactly one thing:
  # turning text into vectors. Alignment, faiss and TMX stay in the backend.
  labse:
    image: '${DOCKER_IMAGE_LABSE-labse-svc}:${TAG-latest}'
    restart: always
    networks:
      - default
    build:
      context: ./services/labse
    volumes:
      - data:/data
    environment:
      - MODEL_PATH=${LABSE_MODEL_PATH-/data/aimodels/LaBSE}
      - FORCE_CPU=${LABSE_FORCE_CPU-false}
      - FP16=${LABSE_FP16-false}
      - BATCH_SIZE=${LABSE_BATCH_SIZE-64}
    healthcheck:
      # /ready stays 503 until the weights are resident, so start_period has to
      # cover a cold load off the mount (~30-90s), not just process start.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

  # Reference-free quality estimation (CometKiwi). Internal only, same shape as
  # labse: reached by the backend as http://qe:8000.
  #
  # Note this and `comet` below build the same image from ./services/comet.
  # Their dependency trees are byte-identical, so separate images would
  # duplicate rather than isolate. They differ only by checkpoint.
  qe:
    image: '${DOCKER_IMAGE_COMET-comet-svc}:${TAG-latest}'
    restart: always
    networks:
      - default
    build:
      context: ./services/comet
    volumes:
      - data:/data
    environment:
      - MODEL_NAME=comekiwi
      - MODEL_PATH=${QE_MODEL_PATH-/data/aimodels/huggingface/checkpoints/model.ckpt}
      - FORCE_CPU=${QE_FORCE_CPU-false}
      - BATCH_SIZE=${QE_BATCH_SIZE-32}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

  # Reference-based COMET (wmt22-comet-da). Same image as `qe`, different
  # checkpoint. Batch-only workload, so this is the one to scale to zero first.
  comet:
    image: '${DOCKER_IMAGE_COMET-comet-svc}:${TAG-latest}'
    restart: always
    networks:
      - default
    build:
      context: ./services/comet
    volumes:
      - data:/data
    environment:
      - MODEL_NAME=comet
      - MODEL_PATH=${COMET_MODEL_PATH-/data/aimodels/wmt22-comet-da/checkpoints/model.ckpt}
      - FORCE_CPU=${COMET_FORCE_CPU-false}
      - BATCH_SIZE=${COMET_BATCH_SIZE-32}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

  # Language identification (lingua), restricted to en+fr. The odd one out:
  # no weights to mount, no GPU, no torch — lingua ships its n-gram data inside
  # the wheel. Hence no `data` volume and no device reservation.
  langid:
    image: '${DOCKER_IMAGE_LANGID-langid-svc}:${TAG-latest}'
    restart: always
    networks:
      - default
    build:
      context: ./services/langid
    environment:
      - LANGUAGES=${LANGID_LANGUAGES-en,fr}
      - MIN_CONFIDENCE=${LANGID_MIN_CONFIDENCE-0.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MetricX-24 hybrid. Own container because MT5ForRegression subclasses
  # transformers internals and wants to track it independently of comet.
  metricx:
    image: '${DOCKER_IMAGE_METRICX-metricx-svc}:${TAG-latest}'
    restart: always
    networks:
      - default
    build:
      context: ./services/metricx
    volumes:
      - data:/data
    environment:
      - MODEL_PATH=${METRICX_MODEL_PATH-/data/aimodels/metricx}
      - FORCE_CPU=${METRICX_FORCE_CPU-false}
      - BATCH_SIZE=${METRICX_BATCH_SIZE-8}
      - MAX_LENGTH=${METRICX_MAX_LENGTH-1536}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 240s

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    build:
      context: ./frontend
      args:
        - VITE_API_URL=https://api.${DOMAIN?Variable not set}
        - NODE_ENV=production
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=80

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=le

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.middlewares=https-redirect
volumes:
  app-db-data:
  data:

networks:
  traefik-public:
    # Allow setting it to false for testing
    external: true
