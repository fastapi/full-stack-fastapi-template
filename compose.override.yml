services:

  # Local services are available on their ports, but also available on:
  # http://api.localhost.tiangolo.com: backend
  # http://dashboard.localhost.tiangolo.com: frontend
  # etc. To enable it, update .env, set:
  # DOMAIN=localhost.tiangolo.com
  proxy:
    image: traefik:3.6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8060:80"
      - "8090:8080"
    # Duplicate the command from compose.yml to add --api.insecure=true
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Add a constraint to only use services with the label for this stack
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log
      # Enable debug logging for local development
      - --log.level=DEBUG
      # Enable the Dashboard and API
      - --api
      # Enable the Dashboard and API in insecure mode for local development
      - --api.insecure=true
    labels:
      # Enable Traefik for this service, to make it available in the public network
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      # Dummy https-redirect middleware that doesn't really redirect, only to
      # allow running it locally
      - traefik.http.middlewares.https-redirect.contenttype.autodetect=false
    networks:
      - traefik-public
      - default

  db:
    restart: "no"
    ports:
      - "5432:5432"

  adminer:
    restart: "no"
    ports:
      - "8080:8080"

  backend:
    restart: "no"
    ports:
      - "8070:8000"
    build:
      context: .
      dockerfile: backend/Dockerfile
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - run
      - --reload
      - "app/main.py"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    # No /data or aimodels mount, and no GPU reservation: this app holds no
    # weights. Every model runs in its own container under services/.
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov
    environment:
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"

  labse:
    restart: "no"
    ports:
      - "8071:8000"
    build:
      context: ./services/labse
    develop:
      watch:
        - path: ./services/labse/app
          action: sync+restart
          target: /app/app
        - path: ./services/labse/pyproject.toml
          action: rebuild
    volumes:
      # Read-only: this service loads weights, it never writes them.
      - ./backend/aimodels:/data/aimodels:ro
    environment:
      HF_HOME: "/data/aimodels"
      FORCE_CPU: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  qe:
    restart: "no"
    ports:
      - "8072:8000"
    build:
      context: ./services/comet
    develop:
      watch:
        - path: ./services/comet/app
          action: sync+restart
          target: /app/app
        - path: ./services/comet/pyproject.toml
          action: rebuild
    volumes:
      - ./backend/aimodels:/data/aimodels:ro
    environment:
      HF_HOME: "/data/aimodels"
      FORCE_CPU: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  comet:
    restart: "no"
    ports:
      - "8073:8000"
    build:
      context: ./services/comet
    volumes:
      - ./backend/aimodels:/data/aimodels:ro
    environment:
      HF_HOME: "/data/aimodels"
      FORCE_CPU: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  langid:
    restart: "no"
    ports:
      - "8075:8000"
    build:
      context: ./services/langid
    develop:
      watch:
        - path: ./services/langid/app
          action: sync+restart
          target: /app/app
        - path: ./services/langid/pyproject.toml
          action: rebuild

  metricx:
    restart: "no"
    ports:
      - "8074:8000"
    build:
      context: ./services/metricx
    develop:
      watch:
        - path: ./services/metricx/app
          action: sync+restart
          target: /app/app
        - path: ./services/metricx/pyproject.toml
          action: rebuild
    volumes:
      - ./backend/aimodels:/data/aimodels:ro
    environment:
      HF_HOME: "/data/aimodels"
      FORCE_CPU: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

  frontend:
    restart: "no"
    ports:
      - "5173:80"
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=http://localhost:8070
        - NODE_ENV=development

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
      - mailcatcher
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://backend:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323

networks:
  traefik-public:
    # For local dev, don't expect an external Traefik network
    external: false
